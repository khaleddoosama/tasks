<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background rounded rectangle -->
  <rect width="64" height="64" rx="14" fill="#6366f1"/>
  <!-- Calendar body -->
  <rect x="10" y="18" width="44" height="36" rx="5" fill="white"/>
  <!-- Calendar header bar -->
  <rect x="10" y="18" width="44" height="14" rx="5" fill="#818cf8"/>
  <rect x="10" y="25" width="44" height="7" fill="#818cf8"/>
  <!-- Binding pegs -->
  <rect x="20" y="13" width="5" height="11" rx="2.5" fill="#c7d2fe"/>
  <rect x="39" y="13" width="5" height="11" rx="2.5" fill="#c7d2fe"/>
  <!-- Grid lines (task rows) -->
  <rect x="15" y="38" width="34" height="3" rx="1.5" fill="#e0e7ff"/>
  <rect x="15" y="44" width="26" height="3" rx="1.5" fill="#e0e7ff"/>
  <rect x="15" y="50" width="30" height="3" rx="1.5" fill="#e0e7ff"/>
  <!-- Check mark on first row -->
  <circle cx="43" cy="39.5" r="3.5" fill="#6366f1"/>
  <polyline points="41.2,39.5 42.5,41 45,37.5" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
